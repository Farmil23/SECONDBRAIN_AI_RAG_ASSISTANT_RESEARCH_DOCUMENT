server.port=5002
spring.thymeleaf.cache=false
spring.application.name=SecondBrainProject

langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:YOUR_API_KEY}

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/secondbrain?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# -> [INFO] Perbaikan Error Dialect: Memaksa Hibernate menggunakan Dialect MySQL agar tidak gagal saat inisialisasi metadata JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

