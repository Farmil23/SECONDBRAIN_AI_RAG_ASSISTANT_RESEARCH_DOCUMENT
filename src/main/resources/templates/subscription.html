<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription - Second Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            height: 100vh;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .pricing-cards {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 30px;
            width: 350px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.pro {
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 20px 40px -10px rgba(245, 158, 11, 0.2);
        }

        .card-badges {
            position: absolute;
            top: -15px;
            right: 20px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
        }

        .card-price {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .card.pro .card-price {
            color: #fbbf24;
        }

        .card-price span {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .features {
            list-style: none;
            padding: 0;
            margin: 0 0 40px 0;
            flex-grow: 1;
        }

        .features li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        .features li svg {
            color: #10b981;
            flex-shrink: 0;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-current {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
            pointer-events: none;
        }

        .btn-upgrade-form {
            width: 100%;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }

        .btn-confirm:hover {
            box-shadow: 0 10px 20px -10px rgba(245, 158, 11, 0.5);
        }

        .back-link {
            margin-top: 40px;
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="header">
            <h1>Choose Your Plan</h1>
            <p>Upgrade to unlock the full potential of your Second Brain.</p>
        </div>

        <div class="pricing-cards">
            <!-- Free Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Free Tier</div>
                    <div class="card-price">$0<span>/forever</span></div>
                </div>
                <ul class="features">
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        10 Questions (Tokens)
                    </li>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Upload basic PDFs
                    </li>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Private isolated space
                    </li>
                </ul>
                <div th:if="${user.subscriptionTier == 'FREE'}">
                    <button class="btn-action btn-current">Current Plan</button>
                </div>
            </div>

            <!-- Pro Card -->
            <div class="card pro">
                <div class="card-badges">POPULAR</div>
                <div class="card-header">
                    <div class="card-title">Pro Tier</div>
                    <div class="card-price">$9<span>/month</span></div>
                </div>
                <ul class="features">
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        1000 Questions (Tokens)
                    </li>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Priority processing
                    </li>
                    <li>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Faster response times
                    </li>
                </ul>

                <div th:if="${user.subscriptionTier == 'FREE'}">
                    <form action="/subscription/confirm" method="POST" class="btn-upgrade-form">
                        <button type="submit" class="btn-action btn-confirm">Confirm Upgrade</button>
                    </form>
                </div>
                <div th:if="${user.subscriptionTier == 'PRO'}">
                    <button class="btn-action btn-current"
                        style="background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.4); color: #fbbf24;">Active
                        Subscription</button>
                </div>
            </div>
        </div>

        <a href="/" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </a>
    </div>
</body>

</html>
