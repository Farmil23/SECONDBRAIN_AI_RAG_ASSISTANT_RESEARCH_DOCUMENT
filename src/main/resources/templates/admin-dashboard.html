<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #f8fafc;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 { margin: 0; font-size: 2rem; color: #3b82f6; }
        .stat-card p { margin: 5px 0 0; color: #cbd5e1; }

        .table-wrapper {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th { color: #94a3b8; font-weight: 600; }
        
        .action-form {
            display: flex;
            gap: 10px;
        }
        .action-form input[type="number"] {
            width: 80px;
            padding: 5px;
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .btn-small {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }
        .btn-upgrade { background: #f59e0b; }
        
        .btn-back {
            text-decoration: none;
            color: #cbd5e1;
            padding: 8px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
        }
    </style>
</head>
<body style="background: #0f172a; min-height: 100vh;">
    <div class="admin-container">
        <div class="header-actions">
            <h1>🛡️ System Administrator</h1>
            <a href="/" class="btn-back">⬅️ Back to Interface</a>
        </div>

        <div th:if="${message}" style="background: rgba(34,197,94,0.2); border: 1px solid #4ade80; color: #4ade80; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <span th:text="${message}"></span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 th:text="${totalUsers}">0</h3>
                <p>Total Registered Users</p>
            </div>
            <div class="stat-card">
                <h3 th:text="${totalTokens}">0</h3>
                <p>Total Global Tokens</p>
            </div>
            <div class="stat-card">
                <h3 th:text="${proUsers}">0</h3>
                <p>PRO Tier Subscriptions</p>
            </div>
        </div>

        <h2>User Management</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Tier</th>
                        <th>Tokens</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.username}">admin</td>
                        <td><span th:text="${u.role}" style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem;">ADMIN</span></td>
                        <td th:text="${u.subscriptionTier}">FREE</td>
                        <td th:text="${u.tokens}">100</td>
                        <td>
                            <div class="action-form">
                                <form action="/admin/add-tokens" method="POST" style="display:inline-flex; gap:5px;">
                                    <input type="hidden" name="userId" th:value="${u.id}">
                                    <input type="number" name="tokenAmount" value="50" min="1">
                                    <button type="submit" class="btn-small">+ Add Tokens</button>
                                </form>
                                <form action="/admin/upgrade-pro" method="POST" style="display:inline;" th:if="${u.subscriptionTier == 'FREE' || u.subscriptionTier == null}">
                                    <input type="hidden" name="userId" th:value="${u.id}">
                                    <button type="submit" class="btn-small btn-upgrade">⭐ Grant PRO</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
