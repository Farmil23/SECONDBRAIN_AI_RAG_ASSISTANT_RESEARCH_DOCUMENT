name: Deploy JaCoCo Coverage to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123
          MYSQL_DATABASE: secondbrain
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Xvfb (For JavaFX tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Tests and Generate JaCoCo Report
        run: xvfb-run mvn clean test -Dmaven.test.failure.ignore=true

      - name: Deploy JaCoCo Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/jacoco
